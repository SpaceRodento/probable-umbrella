; PlatformIO Project Configuration File
;
; Kaksi ympäristöä eri laitteille - käytä oikeaa laitteellesi!
; Käyttö: pio run -e t-display-s3 tai pio run -e t-picoc3

; ============================================
; T-Display-S3 (ESP32-S3, 1.9" näyttö)
; ============================================
[env:t-display-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 asetukset
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default.csv

; USB asetukset
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DTDISPLAY_S3
    -DUSER_SETUP_LOADED=1
    -I include

; Kirjastot näytölle
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

monitor_speed = 115200
upload_speed = 921600

; ============================================
; T-PicoC3 (ESP32-C3, 1.14" näyttö)
; ============================================
[env:t-picoc3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; ESP32-C3 asetukset
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DTPICOC3
    -DUSER_SETUP_LOADED=1
    -I include

; Kirjastot näytölle
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

monitor_speed = 115200
upload_speed = 921600
